version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dealmind_postgres
    environment:
      POSTGRES_USER: dealmind
      POSTGRES_PASSWORD: dealmind_dev_password
      POSTGRES_DB: dealmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dealmind_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealmind_backend
    environment:
      DATABASE_URL: postgresql://dealmind:dealmind_dev_password@postgres:5432/dealmind
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c", "/app/entrypoint.sh python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  # Next.js Web Frontend
  web:
    image: node:18-bullseye
    container_name: dealmind_web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: bash -lc "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: dealmind_network
